<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#26002f"><meta name="description" content="FPL Brain - unofficial Fantasy Premier League analysis">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>FPL Brain</title>
<style>
:root{--bg:#16001d;--panel:#27002f;--panel2:#35003f;--accent:#28d8ef;--accent2:#8d45ff;--text:#fff;--muted:#c9b8cf;--good:#54e39a;--warn:#ffd166;--bad:#ff5b73}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#5d0c78 0,#16001d 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:700px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.pill{padding:7px 11px;border-radius:20px;background:#ffffff12;color:var(--muted);font-size:12px}.hero{margin:8px 14px;padding:22px;border-radius:25px;background:linear-gradient(135deg,#0bcfe8,#7c36e9);box-shadow:0 15px 35px #0005}.hero h1{margin:0 0 4px;font-size:28px}.hero p{margin:0;color:#fff9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.stat{background:#17001d55;padding:12px;border-radius:15px;text-align:center}.stat b{font-size:24px;display:block}.stat span{font-size:11px;color:#fff9}.section{margin:14px;padding:18px;border-radius:22px;background:var(--panel);border:1px solid #ffffff0c}.section h2{margin:0 0 12px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel2);border-radius:17px;padding:14px}.card small{color:var(--muted)}.card b{display:block;font-size:19px;margin-top:5px}.recommend{background:linear-gradient(135deg,#143d52,#3d1261);border:1px solid #36dff077}.recommend .big{font-size:25px;font-weight:900}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.player{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #ffffff10}.player:last-child{border:0}.player .name{font-weight:700}.player .meta{font-size:12px;color:var(--muted)}.badge{font-size:11px;padding:4px 8px;border-radius:12px;background:#ffffff12}.nav{position:fixed;bottom:0;left:0;right:0;background:#17001deF;backdrop-filter:blur(12px);border-top:1px solid #ffffff12;display:flex;justify-content:center;z-index:5}.nav button{flex:1;max-width:175px;padding:12px 5px;background:none;color:var(--muted);font-size:12px}.nav button.active{color:#fff}.nav .ico{display:block;font-size:22px}.inputrow{display:flex;gap:8px}.inputrow input{flex:1;background:#150019;color:#fff;border:1px solid #ffffff22;border-radius:14px;padding:13px}.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:13px 17px;border-radius:14px;font-weight:800}.secondary{background:#ffffff10;color:#fff;padding:12px 15px;border-radius:14px}.hidden{display:none}.loading{text-align:center;color:var(--muted);padding:20px}.error{color:#ffb2bd;background:#5b122255;padding:12px;border-radius:13px}.league{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ffffff10}.league:last-child{border:0}.gap{font-weight:800}.footer{padding:15px;color:#8d7c93;text-align:center;font-size:11px}.tag{display:inline-block;margin-left:6px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:9px 5px;border-bottom:1px solid #ffffff10}.table th{color:var(--muted);font-weight:600}
</style></head>
<body>
<div class="app">
<header class="top"><div class="logo">🧠 FPL Brain</div><div class="pill">UNOFFICIAL</div></header>
<section id="home"></section>
<section id="team" class="hidden"></section>
<section id="leagues" class="hidden"></section>
<section id="settings" class="hidden"></section>
</div>
<nav class="nav"><button data-tab="home" class="active"><span class="ico">🧠</span>Brain</button><button data-tab="team"><span class="ico">👕</span>Team</button><button data-tab="leagues"><span class="ico">⚔️</span>Rivals</button><button data-tab="settings"><span class="ico">⚙️</span>Settings</button></nav>
<script>
const API='https://fantasy.premierleague.com/api';
const state={teamId:localStorage.getItem('fplTeamId')||'3277423',data:null,profile:null,picks:null,fixtures:null,leagues:[],tab:'home',ft:localStorage.getItem('fplFT')||'1'};
const $=s=>document.querySelector(s);
async function get(path){const r=await fetch(API+path,{cache:'no-store'});if(!r.ok)throw new Error('FPL API returned '+r.status);return r.json()}
function money(n){return '£'+(Number(n||0)/10).toFixed(1)+'m'}
function teamName(id){return state.data?.teams?.find(t=>t.id==id)?.short_name||'—'}
function posName(t){return ({1:'GK',2:'DEF',3:'MID',4:'FWD'})[t]||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){
  renderLoading();
  try{
    state.data=await get('/bootstrap-static/');
    const current=state.data.events.find(e=>e.is_current)||state.data.events.find(e=>e.is_next)||state.data.events[0];
    const gw=current.id;
    state.profile=await get('/entry/'+state.teamId+'/');
    state.picks=await get('/entry/'+state.teamId+'/event/'+gw+'/picks/');
    state.fixtures=await get('/fixtures/?event='+(gw+1));
    const ids=(state.profile.leagues?.classic||[]).slice(0,3).map(x=>x.id);
    state.leagues=[];
    for(const id of ids){try{const l=await get('/leagues-classic/'+id+'/standings/?page_standings=1');state.leagues.push({meta:(state.profile.leagues.classic||[]).find(x=>x.id==id),standings:l.standings?.results||[]})}catch(e){}}
    state.gw=gw;state.event=current;render();
  }catch(e){renderError(e.message+' — if FPL blocks direct browser requests, we will add a tiny backend proxy in the next build.');}
}
function renderLoading(){['home','team','leagues','settings'].forEach(x=>$('#'+x).innerHTML='<div class="section loading">Loading FPL Brain…</div>')}
function renderError(msg){$('#home').innerHTML='<div class="section"><h2>Couldn’t load live FPL data</h2><div class="error">'+esc(msg)+'</div><br><button class="primary" onclick="load()">Try again</button></div>';show('home')}
function show(tab){state.tab=tab;['home','team','leagues','settings'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==tab));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function render(){renderHome();renderTeam();renderLeagues();renderSettings();show(state.tab)}
function renderHome(){
 const p=state.profile,h=state.picks.entry_history||{};const players=state.data.elements;const picks=state.picks.picks||[];const captain=picks.find(x=>x.multiplier===2)?.element;const cp=players.find(x=>x.id===captain);const ft=Number(state.ft);
 const total=p.summary_overall_points||h.total_points||0; const gwpts=h.points||0; const rank=p.summary_overall_rank||0;
 $('#home').innerHTML=`<section class="hero"><h1>${esc(p.name||'Your FPL Team')}</h1><p>${esc(p.player_first_name||'')} ${esc(p.player_last_name||'')} · GW${state.gw}</p><div class="stats"><div class="stat"><b>${gwpts}</b><span>GW points</span></div><div class="stat"><b>${total}</b><span>Total points</span></div><div class="stat"><b>${rank?rank.toLocaleString():'—'}</b><span>Overall rank</span></div></div></section>
 <section class="section recommend"><h2>🧠 Brain recommendation</h2><div class="big">${cp?esc(cp.web_name):'Set captain'}</div><p>Captain based on your current selection. <span class="good">Keep analysing before deadline.</span></p><div class="grid"><div class="card"><small>Free transfers</small><b>${ft}</b></div><div class="card"><small>Hit cost</small><b>£? → -4 pts</b></div></div></section>
 <section class="section"><h2>Quick actions</h2><div class="grid"><button class="card secondary" onclick="show('team')">👕 View squad</button><button class="card secondary" onclick="show('leagues')">⚔️ Attack rivals</button></div></section>
 <section class="section"><h2>GW${state.gw} status</h2><p>${esc(state.event?.name||'')}</p><p class="meta">Next deadline: ${state.event?.deadline_time?new Date(state.event.deadline_time).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'—'}</p></section><div class="footer">FPL Brain is an unofficial fan tool and is not affiliated with the Premier League.</div>`;
}
function renderTeam(){
 const players=state.data.elements;const picks=state.picks.picks||[];const rows=picks.map(x=>{const p=players.find(y=>y.id===x.element)||{};return `<div class="player"><div><div class="name">${esc(p.web_name||'Unknown')} ${x.is_captain?'🧢':''}${x.is_vice_captain?' (VC)':''}</div><div class="meta">${posName(p.element_type)} · ${esc(teamName(p.team))} · ${money(p.now_cost)}</div></div><div><span class="badge">${x.position<=11?'XI':'BENCH'}</span></div></div>`}).join('');
 $('#team').innerHTML=`<section class="section"><h2>👕 ${esc(state.profile.name)}</h2><p class="meta">GW${state.gw} squad</p>${rows}</section><section class="section"><h2>🔄 Transfer engine</h2><p>You currently tell Brain how many free transfers you have. Any transfer above that costs <b>-4</b> points.</p><div class="inputrow"><input id="ftInput" type="number" min="0" max="5" value="${state.ft}"><button class="primary" onclick="saveFT()">Save FT</button></div></section>`;
}
function saveFT(){state.ft=Math.max(0,Math.min(5,Number($('#ftInput').value||0)));localStorage.setItem('fplFT',state.ft);renderHome();renderTeam()}
function renderLeagues(){
 let html='<section class="section"><h2>⚔️ Your mini-leagues</h2>';
 for(const l of state.leagues){const me=l.standings.find(x=>x.entry===Number(state.teamId));const leader=l.standings[0];const gap=leader&&me?leader.total-me.total:0;html+=`<div class="league"><div><b>${esc(l.meta?.name||'League')}</b><div class="meta">You: ${me?.rank||'—'} · ${me?.total||0} pts</div></div><div class="gap ${gap<=10?'good':gap<=25?'warn':'bad'}">${gap?gap+' behind':'LEADER'}</div></div>`}
 if(!state.leagues.length)html+='<p class="meta">No public classic leagues found.</p>';
 html+='</section><section class="section"><h2>🎯 Rival attack</h2><p>Next version will compare your squad against the managers immediately above you and identify the best differentials to gain ground.</p><button class="primary" onclick="alert(\'Rival attack engine is the next module.\')">Run rival analysis</button></section>';
 $('#leagues').innerHTML=html;
}
function renderSettings(){ $('#settings').innerHTML=`<section class="section"><h2>⚙️ Settings</h2><p>Enter any FPL Team ID to use Brain with another manager.</p><div class="inputrow"><input id="teamInput" inputmode="numeric" value="${esc(state.teamId)}"><button class="primary" onclick="changeTeam()">Load</button></div><p class="meta">Current team ID: ${esc(state.teamId)}</p></section><section class="section"><h2>📲 Install</h2><p>When this app is hosted over HTTPS, Android Chrome can add it to your home screen like a normal app. This build already includes the PWA manifest and service worker.</p></section>`}
function changeTeam(){const v=$('#teamInput').value.trim();if(!/^\d+$/.test(v))return alert('Enter a numeric FPL Team ID.');state.teamId=v;localStorage.setItem('fplTeamId',v);load()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script></body></html>
