name: Update FPL data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download FPL data
        run: |
          mkdir -p data
          curl -L "https://fantasy.premierleague.com/api/bootstrap-static/" -o data/bootstrap-static.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bootstrap-static.json
          git diff --cached --quiet || git commit -m "Update FPL data"
          git push
